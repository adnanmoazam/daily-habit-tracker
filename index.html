<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Habit Tracker</title>
<meta name="theme-color" content="#1f7a5a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">

<style>
:root{--bg:#f5f6f4;--card:#fff;--tx:#1c2b24;--mut:#6b7a72;--ac:#1f7a5a;--ok:#2e9e6f;--part:#bfe3d1;--bd:#dde3df;--warn:#c0562b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1b2420;--tx:#e6efe9;--mut:#8fa196;--ac:#4cc796;--ok:#2e9e6f;--part:#2a4a3c;--bd:#2b3a33;--warn:#e07a4d}}
:root[data-theme="dark"]{--bg:#121816;--card:#1b2420;--tx:#e6efe9;--mut:#8fa196;--ac:#4cc796;--ok:#2e9e6f;--part:#2a4a3c;--bd:#2b3a33;--warn:#e07a4d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;max-width:760px;margin:0 auto;padding:12px 12px 80px}
h1{font-size:20px;margin:6px 0 10px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 8px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 14px;font-size:16px}
.nav b{font-size:16px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 30%;min-width:90px;padding:12px 8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.num{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.num label{flex:1}
.num button{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:20px}
.num input,.f input{width:72px;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px;text-align:center}
.f{display:flex;gap:8px;margin-bottom:10px}
.f input{width:auto;flex:1;text-align:left}
.btn{padding:10px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-size:15px}
.score{font-size:14px;color:var(--mut);text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--ac)}
.stat span{font-size:12px;color:var(--mut)}
.wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;font-size:12px}
th,td{border:1px solid var(--bd);min-width:30px;height:32px;text-align:center;padding:0}
th{color:var(--mut);font-weight:500;background:var(--card)}
th:first-child,td:first-child{position:sticky;left:0;background:var(--card);min-width:118px;text-align:left;padding:0 8px;z-index:1}
td.l1{background:var(--part)}td.l2{background:var(--ok);color:#fff}
th.td{color:var(--ac);font-weight:700}
.rem{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}
.rem:last-child{border:0}
.rem button{background:none;border:0;color:var(--warn);font-size:15px}
#banner{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--warn);color:#fff;padding:12px;border-radius:10px;margin-bottom:10px;font-weight:600}
.note{font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<h1>Daily Habit Tracker</h1>
<div id="banner" onclick="this.style.display='none'"></div>
<div class="tabs">
<button id="t-today" onclick="go('today')">Today</button>
<button id="t-month" onclick="go('month')">Month</button>
<button id="t-rem" onclick="go('rem')">Reminders</button>
</div>
<div id="app"></div>
<script>
var P=['fajr','dhuhr','asr','maghrib','isha'],PL=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
var W=['wm','wa','wn'],WL=['Morning','After university','Night'];
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S=ld('ht_data',{}),R=ld('ht_rem',[]),tab='today',fired={};
function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
var now=new Date(),cur=key(now),mv=new Date(now.getFullYear(),now.getMonth(),1);
function g(d,f){return (S[d]&&S[d][f])||0}
function st(d,f,v){S[d]=S[d]||{};S[d][f]=v;sv('ht_data',S)}
function cnt(d,a){return a.filter(function(f){return g(d,f)}).length}
function go(t){tab=t;render()}
function tg(f){st(cur,f,g(cur,f)?0:1);render()}
function nm(f,s){st(cur,f,Math.max(0,g(cur,f)+s));render()}
function ns(f,v){st(cur,f,Math.max(0,parseInt(v)||0));render()}
function dshift(n){var p=cur.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]+n);cur=key(d);render()}
function mshift(n){mv=new Date(mv.getFullYear(),mv.getMonth()+n,1);render()}
function chips(a,l){return '<div class="chips">'+a.map(function(f,i){return '<button class="chip'+(g(cur,f)?' on':'')+'" onclick="tg(\''+f+'\')">'+l[i]+'</button>'}).join('')+'</div>'}
function num(f,l,step,u){return '<div class="num"><label>'+l+'</label><button onclick="nm(\''+f+'\',-'+step+')">−</button><input type="number" inputmode="numeric" value="'+g(cur,f)+'" onchange="ns(\''+f+'\',this.value)"><button onclick="nm(\''+f+'\','+step+')">+</button><span class="note">'+u+'</span></div>'}
function today(){
var p=cur.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);
var ttl=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
var done=cnt(cur,P)+cnt(cur,W)+(g(cur,'ctrl')?1:0)+(g(cur,'ex')?1:0),tot=10;
return '<div class="nav"><button onclick="dshift(-1)">‹</button><b>'+ttl+'</b><button onclick="dshift(1)">›</button></div>'+
'<div class="card"><h2>Prayers</h2>'+chips(P,PL)+'</div>'+
'<div class="card"><h2>Study and reading</h2>'+num('uni','University study',15,'min')+num('spec','Special study (army, tests)',15,'min')+num('pages','Book pages read',5,'pages')+'</div>'+
'<div class="card"><h2>Face wash</h2>'+chips(W,WL)+'</div>'+
'<div class="card"><h2>Self-control</h2>'+chips(['ctrl'],['Stayed clean today'])+'</div>'+
'<div class="card"><h2>Exercise</h2>'+chips(['ex'],['Exercise done'])+'<div class="f" style="margin-top:10px"><input id="exn" placeholder="What did you do? (optional)" value="'+((S[cur]&&S[cur].exn)||'').replace(/"/g,'&quot;')+'" onchange="st(cur,\'exn\',this.value)"></div></div>'+
'<div class="score">'+done+' of '+tot+' daily checks complete</div>'}
function cells(){return [
['Prayers (of 5)',function(d){var n=cnt(d,P);return [n||'',n==5?2:n?1:0]}],
['University (hrs)',function(d){var m=g(d,'uni');return [m?+(m/60).toFixed(1):'',m>=120?2:m?1:0]}],
['Special (hrs)',function(d){var m=g(d,'spec');return [m?+(m/60).toFixed(1):'',m>=120?2:m?1:0]}],
['Pages read',function(d){var m=g(d,'pages');return [m||'',m>=20?2:m?1:0]}],
['Face wash (of 3)',function(d){var n=cnt(d,W);return [n||'',n==3?2:n?1:0]}],
['Self-control',function(d){return g(d,'ctrl')?['✓',2]:['',0]}],
['Exercise',function(d){return g(d,'ex')?['✓',2]:['',0]}]]}
function month(){
var y=mv.getFullYear(),m=mv.getMonth(),n=new Date(y,m+1,0).getDate(),keys=[];
for(var i=1;i<=n;i++)keys.push(key(new Date(y,m,i)));
function sum(f){return keys.reduce(function(a,d){return a+g(d,f)},0)}
var pr=keys.reduce(function(a,d){return a+cnt(d,P)},0);
var cd=keys.filter(function(d){return g(d,'ctrl')}).length,ed=keys.filter(function(d){return g(d,'ex')}).length;
var s='<div class="nav"><button onclick="mshift(-1)">‹</button><b>'+mv.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</b><button onclick="mshift(1)">›</button></div>';
s+='<div class="stats"><div class="stat"><b>'+pr+'/'+n*5+'</b><span>Prayers</span></div><div class="stat"><b>'+(sum('uni')/60).toFixed(1)+'h</b><span>University</span></div><div class="stat"><b>'+(sum('spec')/60).toFixed(1)+'h</b><span>Special study</span></div><div class="stat"><b>'+sum('pages')+'</b><span>Pages</span></div><div class="stat"><b>'+cd+'</b><span>Self-control days</span></div><div class="stat"><b>'+ed+'</b><span>Exercise days</span></div></div>';
s+='<div class="wrap"><table><tr><th></th>';
for(i=0;i<n;i++)s+='<th'+(keys[i]==key(new Date())?' class="td"':'')+'>'+(i+1)+'</th>';
s+='</tr>';
cells().forEach(function(r){s+='<tr><td>'+r[0]+'</td>';keys.forEach(function(d){var v=r[1](d);s+='<td class="l'+v[1]+'" onclick="cur=\''+d+'\';go(\'today\')">'+v[0]+'</td>'});s+='</tr>'});
return s+'</table></div><p class="note">Tap any day to open and edit it.</p>'}
function rems(){
var s='<div class="card"><h2>New reminder</h2><div class="f"><input type="time" id="rt" style="flex:0 0 120px"><input id="rx" placeholder="e.g. Run 5 km"></div><button class="btn" onclick="addR()">Add reminder</button></div><div class="card"><h2>Your reminders</h2>';
if(!R.length)s+='<p class="note">No reminders yet.</p>';
R.sort(function(a,b){return a.t<b.t?-1:1});
R.forEach(function(r,i){s+='<div class="rem"><span><b>'+r.t+'</b> &nbsp;'+r.x.replace(/</g,'&lt;')+'</span><button onclick="delR('+i+')">Delete</button></div>'});
s+='</div><button class="btn" onclick="perm()">Allow notifications</button><p class="note">Reminders ring while this page is open in your browser. For reminders that must ring when the app is closed, also set a phone alarm.</p>';
return s}
function addR(){var t=document.getElementById('rt').value,x=document.getElementById('rx').value.trim();if(!t||!x)return;R.push({t:t,x:x});sv('ht_rem',R);render()}
function delR(i){R.splice(i,1);sv('ht_rem',R);render()}
function perm(){try{Notification.requestPermission()}catch(e){}}
function render(){
['today','month','rem'].forEach(function(t){document.getElementById('t-'+t).className=tab==t?'on':''});
document.getElementById('app').innerHTML=tab=='today'?today():tab=='month'?month():rems()}
function chk(){
var d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),dk=key(d);
R.forEach(function(r){var id=dk+r.t+r.x;if(r.t==hm&&!fired[id]){fired[id]=1;var b=document.getElementById('banner');b.textContent='⏰ '+r.t+' — '+r.x;b.style.display='block';
try{if(navigator.vibrate)navigator.vibrate([300,150,300])}catch(e){}
try{if(Notification.permission=='granted')new Notification('Reminder',{body:r.x})}catch(e){}}})}
setInterval(chk,15000);render();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (err) {
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
\n</body>
</html>
